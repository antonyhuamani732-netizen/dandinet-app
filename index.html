<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Política de seguridad (CSP): el navegador solo ejecuta scripts de la propia app, de Google (inicio de sesión)
       y de Leaflet (mapa, con huella fija), y solo se conecta con el servidor de la app y Google.
       Si agrega un servicio externo nuevo, hay que añadir su dirección aquí o el navegador lo bloqueará. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://unpkg.com/leaflet@1.9.4/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://unpkg.com/leaflet@1.9.4/; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://unpkg.com/leaflet@1.9.4/; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self'; manifest-src 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c2447" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#081a33" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Cobranza y control de clientes D@NDINET">
  <title>D@NDINET Cobranza</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="icon" href="icons/icono-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <script src="js/tema.js"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- INICIO DE SESIÓN -->
  <main id="login" class="login" hidden>
    <img src="icons/icono-192.png" alt="D@NDINET" width="96" height="96">
    <h1>D<span class="arroba">@</span>NDINET</h1>
    <p>Cobranza y control de clientes</p>
    <div id="btnGoogle" class="btn-google"></div>
    <p id="loginEstado" class="sub"></p>
    <p class="pie">Solo para usuarios autorizados.</p>
  </main>

  <!-- APLICACIÓN -->
  <div id="app" hidden>
    <a class="saltar" href="#vista">Saltar al contenido</a>
    <header class="cabecera">
      <div class="cabecera-in">
        <a href="#/inicio" class="marca"><img src="icons/icono-192.png" alt="" width="32" height="32"> <span aria-label="D@NDINET">D<span class="arroba">@</span>NDINET</span></a>
        <a href="#/cuenta" id="usuario" class="usuario" aria-label="Mi cuenta"></a>
      </div>
    </header>
    <div id="estado" class="estado" role="status" aria-live="polite"></div>
    <div id="actualizar" class="actualizar" hidden>Hay una versión nueva de la app. <button class="mini verde" id="btnActualizar">Actualizar</button></div>
    <main id="vista" class="vista" tabindex="-1"></main>
    <nav class="inferior" aria-label="Navegación principal">
      <a href="#/inicio" data-r="inicio"><i class="ic" data-ic="inicio"></i>Inicio</a>
      <a href="#/buscar" data-r="buscar"><i class="ic" data-ic="buscar"></i>Buscar</a>
      <a href="#/cola" data-r="cola"><i class="ic" data-ic="cola"></i>Cola<span id="insigniaCola" class="insignia" hidden></span></a>
      <a href="#/hoy" data-r="hoy"><i class="ic" data-ic="recibo"></i>Hoy</a>
      <a href="#/mas" data-r="mas"><i class="ic" data-ic="mas"></i>Más</a>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
